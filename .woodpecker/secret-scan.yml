# Scan the whole history for secrets on every pull request into main, every push to main, and on
# demand.
#
# Two scanners, because they find different things: trufflehog checks what it can against the
# service that issued a credential and reports the rest as unverified, gitleaks matches patterns.
# Both read the full history, so a key that was committed and removed later is still found.
#
# Each scanner is followed by a canary: a credential generated at run time in a throwaway directory,
# which the same command has to report. A green scan therefore also shows that the command could
# have gone red.
#
# The scan runs in the quick pool, so it does not wait behind the builds of other repositories.
labels:
  pool: quick

when:
  - event: pull_request
    branch: main
  - event: push
    branch: main
  - event: manual
    evaluate: 'SECRET_SCAN == "yes"'

clone:
  git:
    image: woodpeckerci/plugin-git:2.12.1@sha256:b8d2401997be68ec25d62bd753fe5d30236e029fe007a5e823177e0e485ae205
    settings:
      partial: false
      depth: 0

steps:
  trufflehog:
    image: trufflesecurity/trufflehog:3.99.9@sha256:2ec535840f860aa27f11fee20222fb790326ecd66325c96bd49d02ec6af46eca
    commands:
      # trufflehog prints the raw value of every finding in its plain output, and a CI log keeps
      # it. The JSON output goes through sed instead, which removes `Raw` and `RawV2` and keeps the
      # detector, the file, the commit and trufflehog's own `Redacted` field. pipefail keeps the
      # exit status of trufflehog, so a finding still fails the step. Each backslash in the
      # expression stands alone inside a bracket, because Woodpecker halves a doubled backslash
      # before the shell reads it.
      #
      # `filtered_unverified` is the fourth result class: trufflehog drops a finding whose value
      # contains a word of its built-in false-positive list, `test` among them, before it sorts the
      # finding into the other three.
      - |
        set -o pipefail
        flags="--results=verified,unknown,unverified,filtered_unverified --fail --no-update"
        # A file that has to stay out of the scan is named in .trufflehog-exclude-paths, one regex per
        # line, with its reason on a `#` line above it. The comment lines are taken out before
        # trufflehog reads the file, and the canary below runs with the same exclusions, so a line
        # that would hide every file fails this step instead of passing it.
        exclude=""
        if [ -f .trufflehog-exclude-paths ]; then
          grep -v -e '^[[:space:]]*#' -e '^[[:space:]]*$' .trufflehog-exclude-paths > /tmp/trufflehog-exclude-paths || true
          exclude="--exclude-paths=/tmp/trufflehog-exclude-paths"
        fi
        # A detector that only ever misreads this repository is named in .trufflehog-exclude-detectors,
        # one name per line with its reason on a `#` line above it. A name with any other character
        # stops the step, so a typo cannot switch off nothing, or everything.
        detectors=""
        if [ -f .trufflehog-exclude-detectors ]; then
          while IFS= read -r name || [ -n "$name" ]; do
            name="$(printf '%s' "$name" | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')"
            case "$name" in ''|'#'*) continue ;; esac
            case "$name" in *[!A-Za-z0-9_.]*) echo "not a detector name in .trufflehog-exclude-detectors: $name"; exit 2 ;; esac
            if [ -n "$detectors" ]; then detectors="$detectors,$name"; else detectors="$name"; fi
          done < .trufflehog-exclude-detectors
        fi
        if [ -n "$detectors" ]; then exclude="$exclude --exclude-detectors=$detectors"; fi
        trufflehog git file://. $flags $exclude --json \
          | sed -E -e 's/"Raw(V2)?":"([^"\]|[\].)*",?//g' -e 's/"SecretParts":[{]("([^"\]|[\].)*":"([^"\]|[\].)*",?)*[}]/"SecretParts":"(removed)"/g' -e 's/"SecretParts":[{].*$/"SecretParts":"(withheld)"}/'

        # The canary. `--fail` is what lets the scan above fail at all, and the results list decides
        # what it may find. Both sit in `flags`, which the canary uses unchanged, and it takes the
        # exclusions in `exclude` as well, so it tests the command as it stands: a planted AWS key
        # pair in a throwaway directory has to come back as exit 183, and an exclusion broad enough
        # to hide it fails here. It runs after the scan, and it goes through the same filter, so the
        # planted pair never reaches the log. The pair is generated here and never written down, so
        # the scan of this repository cannot find it in this file.
        canary="$(mktemp -d)"
        printf '[default]\naws_access_key_id = AKIA%s\naws_secret_access_key = %s\n' \
          "$(tr -dc 'A-Z2-7' < /dev/urandom | head -c 16)" \
          "$(tr -dc 'A-Za-z0-9' < /dev/urandom | head -c 40)" > "$canary/credentials"
        rc=0
        trufflehog filesystem "$canary" $flags $exclude --json 2>&1 \
          | sed -E -e 's/"Raw(V2)?":"([^"\]|[\].)*",?//g' -e 's/"SecretParts":[{]("([^"\]|[\].)*":"([^"\]|[\].)*",?)*[}]/"SecretParts":"(removed)"/g' -e 's/"SecretParts":[{].*$/"SecretParts":"(withheld)"}/' > "$canary/out" || rc=$?
        if [ "$rc" != 183 ]; then
          echo "The canary was not found (exit $rc, 183 expected): the scan above could not have failed as it stands."
          cat "$canary/out"
          exit 1
        fi
        echo "the canary was found (exit 183), so the passing scan above could have failed"
        rm -rf "$canary"

  gitleaks:
    image: zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
    commands:
      - |
        # The canary. Without --config, gitleaks reads a .gitleaks.toml in the directory it scans and
        # its built-in rules when there is none, so the canary passes that file on whenever the scan
        # below would read it. A planted AWS key id in a throwaway directory has to come back as a
        # leak (exit 1), so a scan that can no longer find anything fails here. The id is generated
        # here, never written down, and drawn from the base32 alphabet A-Z2-7 after AKIA, which is
        # what the AWS rule of gitleaks matches.
        cfg=""
        label="the built-in ruleset"
        if [ -f .gitleaks.toml ]; then cfg="--config=.gitleaks.toml"; label=".gitleaks.toml"; fi
        canary="$(mktemp -d)"
        printf 'aws_access_key_id = AKIA%s\n' "$(tr -dc 'A-Z2-7' < /dev/urandom | head -c 16)" > "$canary/credentials"
        rc=0
        gitleaks detect --no-git --source="$canary" $cfg --redact --no-banner > "$canary/out" 2>&1 || rc=$?
        if [ "$rc" != 1 ]; then
          echo "The canary was not found (exit $rc, 1 expected): with $label this scan could not fail."
          cat "$canary/out"
          exit 1
        fi
        echo "the canary was found, so the scan below can fail"
        rm -rf "$canary"
      - gitleaks detect --source=. --redact --no-banner --verbose
